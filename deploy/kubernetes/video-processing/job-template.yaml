apiVersion: batch/v1
kind: Job
metadata:
  name: video-processor-replace-with-attempt-id
  namespace: video-processing
  labels:
    app.kubernetes.io/name: video-processor
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lago-media-services
    lago.job-type: replace-with-job-type
    lago.production-id: replace-with-production-id
    lago.request-id: replace-with-request-id
    lago.attempt-id: replace-with-attempt-id
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-processor
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: lago-media-services
        lago.job-type: replace-with-job-type
        lago.production-id: replace-with-production-id
        lago.request-id: replace-with-request-id
        lago.attempt-id: replace-with-attempt-id
    spec:
      serviceAccountName: video-processor
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: video-processor
          image: replace-with-registry/lago-video-processor:replace-with-version
          imagePullPolicy: IfNotPresent
          args:
            - --request-url
            - replace-with-request-read-sas-url
          envFrom:
            - configMapRef:
                name: video-processor-config
            - secretRef:
                name: video-processor-secrets
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 16Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 16Gi
