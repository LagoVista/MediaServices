apiVersion: v1
kind: ConfigMap
metadata:
  name: video-processor-config
  namespace: video-processing
  labels:
    app.kubernetes.io/name: video-processor
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lago-media-services
data:
  DOTNET_ENVIRONMENT: Production

  VideoAssembly__FfmpegPath: /usr/bin/ffmpeg
  VideoAssembly__FfprobePath: /usr/bin/ffprobe
  VideoAssembly__WorkspaceRoot: /workspace
  VideoAssembly__PreserveFailedWorkspace: "false"
  VideoAssembly__HttpTimeoutMinutes: "15"
  VideoAssembly__CallbackTimeoutSeconds: "30"
  VideoAssembly__CallbackMaxAttempts: "3"
  VideoAssembly__CallbackRetryDelaySeconds: "2"
  VideoAssembly__FontFamily: Manrope
  VideoAssembly__FontDirectory: /app/fonts
  VideoAssembly__TusChunkSizeBytes: "16777216"

  RabbitNotifications__Enabled: "true"
  RabbitNotifications__Port: "5672"
  RabbitNotifications__VirtualHost: /
  RabbitNotifications__Exchange: dev.notif.publish
  RabbitNotifications__RoutingKey: dev-notif-publish
  RabbitNotifications__ClientName: VideoProcessorNotificationPublisher
